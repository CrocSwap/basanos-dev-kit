[project]
name = "basanos-sdk"
version = "0.1.0"
license = "MIT"
description = "Standalone Python SDK for DCG unified documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "solders>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basanos_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
